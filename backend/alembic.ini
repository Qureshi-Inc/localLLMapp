# CaseVault backend environment variables
DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/casevault
QDRANT_URL=http://qdrant:6333
OLLAMA_URL=http://ollama:11434
STORAGE_MODE=localfs
MINIO_ENDPOINT=minio:9000
MINIO_ACCESS_KEY=casevault-minio-key
MINIO_SECRET_KEY=casevault-minio-secret

[alembic]
script_location = casevault/alembic
prepend_sys_path = .
version_path_separator = os

sqlalchemy.url = postgresql+asyncpg://postgres:postgres@postgres:5432/casevault

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
