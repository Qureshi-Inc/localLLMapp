version: '3.8'

services:
  app:
    build: .
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # SECURITY: never commit real secrets. These are required at runtime and
      # compose will refuse to start if they are unset/empty (CWE-798).
      # Provide them via a local .env file (git-ignored) or your secret manager.
      # Generate SESSION_SECRET with: openssl rand -base64 32
      - DATABASE_URL=postgresql://socialplanner:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgres:5432/socialplanner
      - SESSION_SECRET=${SESSION_SECRET:?SESSION_SECRET must be set (openssl rand -base64 32)}
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=socialplanner
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      - POSTGRES_DB=socialplanner
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U socialplanner"]
      interval: 5s
      timeout: 5s
      retries: 5

  migrate:
    image: node:20-alpine
    depends_on:
      postgres:
        condition: service_healthy
    working_dir: /app
    environment:
      - DATABASE_URL=postgresql://socialplanner:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgres:5432/socialplanner
    volumes:
      - .:/app
    entrypoint: ["sh", "-c", "npx prisma generate && npx prisma migrate deploy"]

volumes:
  postgres_data:
